services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet_transfer
    ports:
      # Host 5432 is often already taken. The app inside Compose uses hostname postgres:5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_transfer"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - wallet_pg:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet_transfer?sslmode=disable
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  wallet_pg:
